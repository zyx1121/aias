# aias stack inside the `aias` WSL distro, installed to /opt/aias.
# `docker compose up -d` starts only the MCP server. The engines sit in the
# `engine` profile and are started by the MCP tools, which admit each model
# against a VRAM budget so several share the card.
name: aias

# Ollama's context and KV cache type, shared with the MCP server, which sizes
# a model's KV cache from them before it is first loaded.
x-ollama-num-ctx: &ollama-num-ctx "32768"
x-ollama-kv-type: &ollama-kv-type q8_0

services:
  mcp:
    build: ./mcp
    image: aias-mcp:local
    restart: unless-stopped
    # tini as PID 1 reaps decoder children that are killed after their parent.
    init: true
    gpus: all
    ports: ["127.0.0.1:11400:11400"]
    environment:
      NVIDIA_DRIVER_CAPABILITIES: utility
      AIAS_COMPOSE: /opt/aias/compose.yaml
      # VRAM budget = card - desktop reserve - safety margin (mcp/vram.py).
      AIAS_DESKTOP_RESERVE_MIB: ${AIAS_DESKTOP_RESERVE_MIB:-1024}
      AIAS_SAFETY_MIB: ${AIAS_SAFETY_MIB:-512}
      AIAS_OLLAMA_NUM_CTX: *ollama-num-ctx
      AIAS_OLLAMA_KV_CACHE_TYPE: *ollama-kv-type
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/aias:/opt/aias:ro
      - hf-cache:/root/.cache/huggingface
      - ollama:/ollama:ro
      # Measured model footprints, pins and which Ollama models aias loaded.
      - aias-state:/state
      # Downloaded audio and its decoded WAV, shared with the decoder.
      - audio-work:/work
      # Sound files generate_audio made, served on /files until they expire.
      - audio-out:/out

  ollama:
    image: ollama/ollama:0.32.15
    profiles: [engine]
    gpus: all
    ports: ["127.0.0.1:11434:11434"]
    volumes:
      - ollama:/root/.ollama
    environment:
      OLLAMA_CONTEXT_LENGTH: *ollama-num-ctx
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: *ollama-kv-type
      # aias decides what fits; Ollama must not unload models on its own count.
      OLLAMA_MAX_LOADED_MODELS: "16"

  vllm:
    image: vllm/vllm-openai:v0.30.0
    profiles: [engine]
    gpus: all
    ipc: host
    ports: ["127.0.0.1:8000:8000"]
    volumes:
      - hf-cache:/root/.cache/huggingface
      - vllm-cache:/root/.cache/vllm
    # Speech to text: the MCP server sends up to 2 hours of 16 kHz mono WAV
    # (230 MB, 461 MB as float32 once decoded), and vLLM splits it into
    # 30 s clips itself. The defaults stop at 25 MB and 10 minutes.
    environment:
      VLLM_MAX_AUDIO_CLIP_FILESIZE_MB: "256"
      VLLM_MAX_AUDIO_DECODE_DURATION_S: "7200"
      VLLM_MAX_AUDIO_DECODE_BYTES: "536870912"
    # The Windows desktop holds about 1 GB of VRAM, so vLLM's 0.92 default
    # fails at startup on a 10 GB card.
    command:
      - --model=${VLLM_MODEL:-Qwen/Qwen3-0.6B}
      - --max-model-len=${VLLM_MAX_LEN:-8192}
      - --gpu-memory-utilization=${VLLM_GPU_UTIL:-0.8}
      # A fixed KV cache, so the instance takes the same memory next to other
      # engines as alone (see mcp/server.py).
      - --kv-cache-memory=${VLLM_KV_BYTES:-4294967296}

  # Decodes audio for the MCP server, one `compose run` per file. It sees only
  # its job's directory under /work, has no network, cannot write elsewhere,
  # holds no capabilities and cannot gain any.
  decoder:
    build: ./decoder
    image: aias-decoder:local
    profiles: [tool]
    network_mode: none
    read_only: true
    user: "65534:65534"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 3g
    pids_limit: 64
    tmpfs: ["/tmp:size=64m"]
    volumes:
      - audio-work:/work

  # Speaker diarization. Built on first use (about 11 GB), not at install.
  # No published port: the MCP server calls it on the compose network.
  nemo:
    build: ./nemo
    image: aias-nemo:local
    profiles: [engine]
    gpus: all
    environment:
      NEMO_MODEL: ${NEMO_MODEL:-nvidia/Nemotron-3-Diarization}
    volumes:
      - hf-cache:/root/.cache/huggingface
      - nemo-cache:/cache

  # Sound effects from text (AudioGen). Built on first use, not at install.
  # No published port: the MCP server calls it on the compose network.
  audio:
    build: ./audio
    image: aias-audio:local
    profiles: [engine]
    gpus: all
    environment:
      AUDIO_MODEL: ${AUDIO_MODEL:-facebook/audiogen-medium}
    volumes:
      - hf-cache:/root/.cache/huggingface

volumes:
  aias-state:
  audio-out:
  audio-work:
  hf-cache:
  vllm-cache:
  nemo-cache:
  ollama:
